name: Sprint 4 — Python 3.12

on:
  push:
    branches: [main, feature/blogicum-sprint4]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate migrations
        run: python blogicum/manage.py makemigrations --check --dry-run
      - name: Run official tests
        run: python -m pytest -q
      - name: Check style
        run: python -m flake8 blogicum
